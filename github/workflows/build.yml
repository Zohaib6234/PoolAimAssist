
name: Build PoolAimAssist APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: unzip -q PoolAimAssist-ready-to-build.zip

      - name: Build APK
        working-directory: PoolAimAssist-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PoolAimAssist-APK
          path: PoolAimAssist-main/app/build/outputs/apk/debug/app-debug.apk
